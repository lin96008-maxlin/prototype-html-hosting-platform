name: 手动部署演示环境

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 输入 deploy 确认发布到新演示环境
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: prototype-hosting-platform-demo-deploy
  cancel-in-progress: false

env:
  NEXT_PUBLIC_BASE_PATH: /manage

jobs:
  build:
    name: 检查并生成部署制品
    if: inputs.confirm == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 质量检查
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build

      - name: 打包独立制品
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/prebuilt/standalone release/prebuilt/static
          cp -a .next/standalone/. release/prebuilt/standalone/
          cp -a .next/static/. release/prebuilt/static/
          cp -a scripts database docker ops release/
          cp Dockerfile.prebuilt docker-compose.yml docker-compose.server.yml Caddyfile release/
          tar -czf prototype-hosting-platform-demo.tar.gz -C release .

      - name: 保存部署制品
        uses: actions/upload-artifact@v6
        with:
          name: prototype-hosting-platform-demo-${{ github.sha }}
          path: prototype-hosting-platform-demo.tar.gz
          retention-days: 7

  deploy:
    name: 发布到新演示环境
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: demo
    steps:
      - name: 获取部署制品
        uses: actions/download-artifact@v8
        with:
          name: prototype-hosting-platform-demo-${{ github.sha }}

      - name: 配置新环境连接
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${DEPLOY_SSH_KEY:?缺少新环境 DEPLOY_SSH_KEY}"
          : "${DEPLOY_KNOWN_HOSTS:?缺少新环境 DEPLOY_KNOWN_HOSTS}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: 上传并发布
        shell: bash
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?缺少新环境 DEPLOY_HOST}"
          : "${DEPLOY_PORT:?缺少新环境 DEPLOY_PORT}"
          : "${DEPLOY_USER:?缺少新环境 DEPLOY_USER}"
          archive=prototype-hosting-platform-demo.tar.gz
          release_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          scp -P "$DEPLOY_PORT" "$archive" "$DEPLOY_USER@$DEPLOY_HOST:incoming/$archive"
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo /usr/local/sbin/prototype-demo-deploy '$GITHUB_SHA' '$release_id'"
